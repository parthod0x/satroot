name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install -e ".[crypto,validation]"

      - name: Smoke test installed modules
        run: |
          python -c "import satroot1, satroot_collection_lint, satroot_test, satroot_demo_bundle_index_matrix_smoke, satroot_stable_demo_bundle_index_smoke, satroot_machine_demo_bundle_index_smoke, satroot_demo_release_catalog_index_matrix_smoke, satroot_stable_demo_release_catalog_index_smoke, satroot_machine_demo_release_catalog_index_smoke, satroot_demo_release_catalog_matrix_smoke, satroot_stable_demo_release_catalog_smoke, satroot_machine_demo_release_catalog_smoke, satroot_profile_federation_smoke, satroot_profile_matrix_smoke, satroot_stable_profile_smoke, satroot_machine_profile_smoke, satroot_receipt_profile_smoke, satroot_identity_profile_smoke, satroot_license_profile_smoke; print('imports-ok')"

      - name: Run demo bundle-index matrix smoke workflow
        run: |
          python -m satroot_demo_bundle_index_matrix_smoke --output-dir .tmp_demo_bundle_index_matrix_smoke_ci

      - name: Run demo release-catalog-index matrix smoke workflow
        run: |
          python -m satroot_demo_release_catalog_index_matrix_smoke --output-dir .tmp_demo_release_catalog_index_matrix_smoke_ci

      - name: Run demo release-catalog matrix smoke workflow
        run: |
          python -m satroot_demo_release_catalog_matrix_smoke --output-dir .tmp_demo_release_catalog_matrix_smoke_ci

      - name: Run released profile-matrix smoke workflow
        run: |
          python -m satroot_profile_matrix_smoke --output-dir .tmp_profile_matrix_smoke_ci

      - name: Run profile-federation smoke workflow
        run: |
          python -m satroot_profile_federation_smoke --output-dir .tmp_profile_federation_smoke_ci

      - name: Run chunked pytest suite
        run: |
          python -m satroot_test --chunk-size 100
