name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install -e ".[crypto,validation]"

      - name: Smoke test installed modules
        run: |
          python -c "import satroot1, satroot_collection_lint, satroot_test, satroot_stable_profile_smoke, satroot_machine_profile_smoke, satroot_receipt_profile_smoke; print('imports-ok')"

      - name: Run stable-profile smoke workflow
        run: |
          python -m satroot_stable_profile_smoke --output-dir .tmp_stable_profile_smoke_ci

      - name: Run machine-profile smoke workflow
        run: |
          python -m satroot_machine_profile_smoke --output-dir .tmp_machine_profile_smoke_ci

      - name: Run receipt-profile smoke workflow
        run: |
          python -m satroot_receipt_profile_smoke --output-dir .tmp_receipt_profile_smoke_ci

      - name: Run chunked pytest suite
        run: |
          python -m satroot_test --chunk-size 100
