name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install -e ".[crypto,validation]"

      - name: Smoke test installed modules
        run: |
          python -c "import satroot1, satroot_collection_lint, satroot_test, satroot_release_gate_smoke, satroot_operator_proof_smoke, satroot_publication_ladder_smoke, satroot_singleton_publication_ladder_smoke, satroot_federated_registry_collection_smoke, satroot_singleton_demo_bundle_index_matrix_smoke, satroot_receipt_demo_bundle_index_smoke, satroot_identity_demo_bundle_index_smoke, satroot_license_demo_bundle_index_smoke, satroot_singleton_demo_release_smoke_support, satroot_singleton_demo_release_catalog_matrix_smoke, satroot_receipt_demo_release_catalog_smoke, satroot_identity_demo_release_catalog_smoke, satroot_license_demo_release_catalog_smoke, satroot_singleton_demo_release_catalog_index_matrix_smoke, satroot_receipt_demo_release_catalog_index_smoke, satroot_identity_demo_release_catalog_index_smoke, satroot_license_demo_release_catalog_index_smoke, satroot_demo_bundle_index_matrix_smoke, satroot_stable_demo_bundle_index_smoke, satroot_machine_demo_bundle_index_smoke, satroot_demo_release_catalog_index_matrix_smoke, satroot_stable_demo_release_catalog_index_smoke, satroot_machine_demo_release_catalog_index_smoke, satroot_demo_release_catalog_matrix_smoke, satroot_stable_demo_release_catalog_smoke, satroot_machine_demo_release_catalog_smoke, satroot_profile_federation_smoke, satroot_profile_matrix_smoke, satroot_stable_profile_smoke, satroot_machine_profile_smoke, satroot_receipt_profile_smoke, satroot_identity_profile_smoke, satroot_license_profile_smoke, satroot_anchored_demo_smoke, satroot_anchored_publication_smoke, satroot_onchain_envelope_smoke, satroot_envelope_verification_smoke; print('imports-ok')"

      - name: Run release-gate smoke workflow
        run: |
          python -m satroot_release_gate_smoke --output-dir .tmp_release_gate_smoke_ci --skip-import-smoke
