[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "satroot"
version = "0.1.0"
description = "SATROOT-1: one native satoshi as root witness for unbounded semantic token state."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
  { name = "PARTH MAURIA SAXENA", email = "parthms.id@gmail.com" }
]
keywords = ["bsv", "bitcoin", "satoshi", "tokens", "semantic-ledger", "machine-native"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries :: Python Modules"
]

[project.optional-dependencies]
crypto = ["cryptography>=42"]
validation = ["jsonschema>=4.23"]

[project.scripts]
satroot1 = "satroot1:main"
satroot-test = "satroot_test:main"
satroot-demo-release-catalog-index-matrix-smoke = "satroot_demo_release_catalog_index_matrix_smoke:main"
satroot-stable-demo-release-catalog-index-smoke = "satroot_stable_demo_release_catalog_index_smoke:main"
satroot-machine-demo-release-catalog-index-smoke = "satroot_machine_demo_release_catalog_index_smoke:main"
satroot-demo-release-catalog-matrix-smoke = "satroot_demo_release_catalog_matrix_smoke:main"
satroot-stable-demo-release-catalog-smoke = "satroot_stable_demo_release_catalog_smoke:main"
satroot-machine-demo-release-catalog-smoke = "satroot_machine_demo_release_catalog_smoke:main"
satroot-profile-federation-smoke = "satroot_profile_federation_smoke:main"
satroot-profile-matrix-smoke = "satroot_profile_matrix_smoke:main"
satroot-stable-profile-smoke = "satroot_stable_profile_smoke:main"
satroot-machine-profile-smoke = "satroot_machine_profile_smoke:main"
satroot-receipt-profile-smoke = "satroot_receipt_profile_smoke:main"
satroot-identity-profile-smoke = "satroot_identity_profile_smoke:main"
satroot-license-profile-smoke = "satroot_license_profile_smoke:main"

[tool.setuptools]
py-modules = ["satroot1", "satroot_collection_lint", "satroot_test", "satroot_demo_release_catalog_index_matrix_smoke", "satroot_stable_demo_release_catalog_index_smoke", "satroot_machine_demo_release_catalog_index_smoke", "satroot_demo_release_catalog_matrix_smoke", "satroot_stable_demo_release_catalog_smoke", "satroot_machine_demo_release_catalog_smoke", "satroot_profile_federation_smoke", "satroot_profile_matrix_smoke", "satroot_stable_profile_smoke", "satroot_machine_profile_smoke", "satroot_receipt_profile_smoke", "satroot_identity_profile_smoke", "satroot_license_profile_smoke"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
